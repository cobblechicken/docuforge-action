name: 'DocuForge AI Documentation'
description: 'Autonomously generate codebase architecture markdown & Mermaid flowcharts using DocuForge AI'
author: 'DocuForge'

inputs:
  api_key:
    description: 'DocuForge API Key'
    required: false
  output_file:
    description: 'Target markdown file path'
    required: false
    default: 'DOCUMENTATION.md'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run DocuForge CLI
      shell: bash
      run: |
        npx docuforge --output "${{ inputs.output_file }}"
